[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sedimentcfd"
version = "0.1.0"
description = "Minimal planar FEM flow and conservative suspended sediment prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
sedimentcfd = "sedimentcfd.__main__:main"

[tool.setuptools.package-data]
sedimentcfd = ["web/*.html"]

[tool.setuptools]
packages = ["sedimentcfd"]
